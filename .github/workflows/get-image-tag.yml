name: Get Image TAG

on:
  workflow_call:
    outputs:
      tags:
        description: Tags da imagem, separadas por espaço
        value: ${{ jobs.get.outputs.tags }}

jobs:
  get:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      # Release publicada → produção: tag da release + latest.
      # Disparo manual (workflow_dispatch) → stage: stage + sha do commit.
      - id: tags
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            TAGS="$(echo "$RELEASE_TAG" | tr '/' '-') latest"
          else
            TAGS="stage sha-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
