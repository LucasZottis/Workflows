name: Obter Tag

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: lucas/workflows-compartilhados/.github/workflows/deploy.yml@v1
    with:
      package-name: jogadinha-de-paiol
      tags: ${{ github.event_name == 'release' && format('{0} latest', github.event.release.tag_name) || format('stage sha-{0}', github.sha) }}
