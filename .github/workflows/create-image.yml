name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Definir nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Release publicada → produção: tag da release + latest.
      # Disparo manual (workflow_dispatch) → stage: stage + sha do commit.
      - name: Definir tags da imagem
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="$(echo '${{ github.event.release.tag_name }}' | tr '/' '-') latest"
          else
            TAGS="stage sha-${GITHUB_SHA::7}"
          fi
          echo "TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build da imagem Docker
        run: |
          ARGS=""
          for t in $TAGS; do ARGS="$ARGS -t ${{ env.IMAGE }}:$t"; done
          docker build $ARGS .

      - name: Push da imagem para o GHCR
        run: docker push ${{ env.IMAGE }} --all-tags

      # A atualização da VPS em produção ainda não tem mecanismo definido
      # (ver "Decisões — Deploy de Aplicações na VPS", seção 2 — item em aberto).
      # Nenhum passo de deploy para a VPS foi adicionado aqui de propósito.