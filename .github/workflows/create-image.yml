name: Create Image

on:
  workflow_call:
    inputs:
      package-name:
        description: Nome do pacote no GHCR (sem o dono)
        required: true
        type: string
      tags:
        description: Tags da imagem, separadas por espaço
        required: true
        type: string
      dockerfile:
        description: Caminho do Dockerfile (padrão = Dockerfile na raiz)
        required: false
        type: string
        default: Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Definir nome da imagem em minúsculas
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ inputs.package-name }}
        run: echo "IMAGE=ghcr.io/$(echo "$OWNER/$PACKAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build da imagem Docker
        env:
          TAGS: ${{ inputs.tags }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          ARGS=""
          for t in $TAGS; do ARGS="$ARGS -t $IMAGE:$(echo "$t" | tr '/' '-')"; done
          docker build -f "$DOCKERFILE" $ARGS .

      - name: Push da imagem para o GHCR
        run: docker push $IMAGE --all-tags

      # A atualização da VPS em produção ainda não tem mecanismo definido
      # (ver "Decisões — Deploy de Aplicações na VPS", seção 2 — item em aberto).
      # Nenhum passo de deploy para a VPS foi adicionado aqui de propósito.
