name: Build e testes

on:
  workflow_call:
    inputs:
      solution:
        description: Caminho da solution ou projeto (vazio = procura na raiz)
        required: false
        type: string
        default: ''

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOLUTION: ${{ inputs.solution }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore $SOLUTION

      - name: Compilar e executar testes
        run: dotnet test $SOLUTION --configuration Release --no-restore
